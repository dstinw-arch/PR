<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>普渡贊普送品行程 · 淡水信合社公關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--paper:#f3f3ef;--card:#fff;--ink:#23271f;--mute:#6d7268;--forest:#3a5134;--green:#4f953b;--sage:#8c9184;--gray:#a7a7a2;--line:rgba(58,81,52,.14);--line2:rgba(58,81,52,.08);--done-bg:#eef5ea;--recv-bg:#e7eee4;--warn:#a1573a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;font-size:15px;padding-bottom:56px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}

/* login */
#login{position:fixed;inset:0;background:var(--forest);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
#login .card{background:var(--card);border-radius:20px;padding:30px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#login .otter{width:132px;margin:0 auto 6px}
#login .otter-svg{width:100%;height:auto;display:block}
#login .brand{font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;letter-spacing:4px;color:var(--forest);margin:0 0 18px}
#pw{width:100%;font-size:22px;text-align:center;letter-spacing:8px;padding:12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;color:var(--forest);font-weight:700}
#pw:focus{outline:none;border-color:var(--green)}
#login button{width:100%;margin-top:14px;background:var(--forest);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
#login button:active{transform:scale(.98)}
#loginErr{color:var(--warn);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
#login .hint{font-size:12px;color:var(--sage);margin-top:16px;line-height:1.7}

header{background:var(--forest);color:#f3f3ef;padding:20px 0 16px;position:relative;overflow:hidden}
header::after{content:"贊普";position:absolute;right:-4px;top:-16px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:120px;color:rgba(255,255,255,.06);line-height:1;pointer-events:none;letter-spacing:4px}
.h-top{display:flex;justify-content:space-between;align-items:flex-start}
.h-eyebrow{font-size:12px;letter-spacing:3px;color:#b9c6b0;font-weight:500}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:27px;margin:2px 0 6px;letter-spacing:1px}
.h-sub{font-size:12.5px;color:#cdd6c6}
.rolebadge{text-align:right;font-size:11px;color:#cdd6c6;flex:none}
.rolebadge b{display:block;font-size:14px;color:#fff;font-weight:700;margin-bottom:2px}
.rolebadge button{margin-top:4px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:3px 10px;font-size:11px;font-family:inherit;cursor:pointer}
.h-note{margin-top:9px;display:inline-flex;gap:6px;background:rgba(255,255,255,.12);padding:4px 11px;border-radius:999px;font-size:12.5px;color:#eaf0e6}
.h-note b{color:#c6ff9e;font-weight:700}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.stat .n{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;line-height:1;color:#fff}
.stat .l{font-size:11px;color:#cdd6c6;margin-top:4px}
.barwrap{margin-top:10px}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:#cdd6c6;margin-bottom:3px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:7px}
.bar>i{display:block;height:100%;width:0;transition:width .5s}
.bar.d>i{background:linear-gradient(90deg,var(--green),#7bc45f)}
.bar.r>i{background:linear-gradient(90deg,#8fb583,#c7dcbd)}
.me{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:#dbe3d5}
.me button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
.me b{color:#fff}

.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line);color:var(--mute);cursor:pointer}
.tab.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg div{flex:1;text-align:center;padding:7px 0;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;border-right:1px solid var(--line)}
.seg div:last-child{border-right:none}
.seg div.on{background:var(--sage);color:#fff}
.rowline{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;font-family:inherit}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.chip .c{opacity:.7;font-size:11px;margin-left:3px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap;font-weight:600}
.sw{width:38px;height:22px;border-radius:99px;background:var(--gray);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.toggle.on .sw{background:var(--green)}.toggle.on .sw::after{left:18px}

.day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 0;background:var(--done-bg);border-radius:12px;line-height:1}
.day-date .md{font-family:"Noto Serif TC",serif;font-weight:900;font-size:21px;color:var(--forest)}
.day-date .wd{font-size:11px;color:var(--green);font-weight:700;margin-top:3px}
.day-meta{flex:1;min-width:0}.day-meta .roc{font-weight:700;font-size:15px}.day-meta .sub{font-size:12px;color:var(--mute);margin-top:1px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:none;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--forest)}
.ring span{width:34px;height:34px;background:var(--card);border-radius:50%;display:grid;place-items:center}
.rg{padding:2px 0}.rg-h{font-size:11.5px;letter-spacing:2px;color:var(--sage);font-weight:700;padding:9px 16px 3px}

.drow{padding:11px 16px;border-top:1px solid var(--line2);border-left:3px solid transparent}
.drow:first-child{border-top:none}
.drow.d{border-left-color:var(--green)}
.drow.dr{border-left-color:var(--forest)}
.nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev{font-size:12px;color:var(--mute);margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}
.t-temple{color:#fff;background:var(--forest)}
.t-comm{color:var(--sage);background:rgba(140,145,132,.14)}
.t-rg{color:var(--sage);background:rgba(140,145,132,.14)}
.pf{font-size:11px;font-weight:700;color:var(--green);background:var(--done-bg);padding:1px 7px;border-radius:6px}
.sub2{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.5}
.sub2 a{color:var(--sage);text-decoration:none;border-bottom:1px dashed var(--line)}
.ddl{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-top:4px;background:var(--done-bg);color:var(--forest)}
.ddl.soon{background:#f4ede4;color:var(--warn)}.ddl.over{background:#f1e2da;color:var(--warn)}
.stbadge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;color:var(--mute);background:rgba(167,167,162,.16);margin-left:4px}
.stbadge.set{color:var(--forest);background:var(--done-bg)}

.acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);background:#fff;user-select:none}
.chip2 svg{width:13px;height:13px;stroke:currentColor;stroke-width:3.5;fill:none;opacity:.3}
.chip2.deliver.on{background:var(--done-bg);border-color:var(--green);color:var(--green)}
.chip2.receipt.on{background:var(--recv-bg);border-color:var(--forest);color:var(--forest)}
.chip2.on svg{opacity:1}
.chip2.can{cursor:pointer}.chip2.can:active{transform:scale(.95)}
.chip2:not(.can){opacity:.6}
.chip2 b{font-weight:700}
.metaline{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.5}
.metaline .d{color:var(--green);font-weight:700}
.metaline .r{color:var(--forest);font-weight:700}

.block{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.block>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.block>summary::-webkit-details-marker{display:none}
.block .cnt{font-size:12px;color:#fff;background:var(--forest);border-radius:99px;padding:2px 9px;font-weight:700}
.block .body{padding:2px 16px 14px}
.future-note{font-size:13px;color:var(--mute);padding:8px 0 6px;line-height:1.6}
.future-items{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.future-items span{background:var(--done-bg);color:var(--forest);font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px dashed var(--green)}
footer{text-align:center;color:var(--mute);font-size:11.5px;padding:22px 0 8px;line-height:1.7}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.dot.live{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,149,59,.5)}70%{box-shadow:0 0 0 7px rgba(79,149,59,0)}100%{box-shadow:0 0 0 0 rgba(79,149,59,0)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:120;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:22px 16px;text-align:center;color:var(--mute)}
#app{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const REGION_ORDER=["石門","金山","三芝","淡水","八里","五股","泰山","新莊","林口"];
const WD={0:"日",1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
let statusMap={}, view="date", typeFilter="全部", regionFilter="全部", pendOnly=false;
let role=loadRole(), deliverer=loadName(), sb=null;

function loadRole(){try{return localStorage.getItem("pudu_role")||null}catch(e){return null}}
function loadName(){try{return localStorage.getItem("pudu_deliverer")||""}catch(e){return ""}}
function saveName(v){try{localStorage.setItem("pudu_deliverer",v)}catch(e){}}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function telify(raw){if(!raw)return null;let m=raw.match(/09\d{2}[- ]?\d{3}[- ]?\d{3}/);if(m)return m[0].replace(/[- ]/g,"");let l=raw.match(/\(?0\d\)?[- ]?\d{3,4}[- ]?\d{3,4}/)||raw.match(/\d{4}[- ]?\d{4}/)||raw.match(/\d{7,8}/);if(l){let d=l[0].replace(/[^0-9]/g,"");return d[0]==="0"?d:"02"+d}return null}
function mapUrl(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("新北市"+a)}
function fmtTime(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1700)}
function isD(seq){return statusMap[seq]&&statusMap[seq].delivered}
function isR(seq){return statusMap[seq]&&statusMap[seq].receipt_received}
function daysLeft(iso){const t=new Date();t.setHours(0,0,0,0);const d=new Date(iso);d.setHours(0,0,0,0);return Math.round((d-t)/86400000)}

/* login */
function showLogin(){document.getElementById("login").style.display="flex";document.getElementById("app").style.display="none";setTimeout(()=>document.getElementById("pw").focus(),50)}
function enterApp(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";updateRoleUI();renderChips();render();if(!deliverer)promptName(false)}
function tryLogin(){const v=document.getElementById("pw").value.trim();
  if(v===PW_DELIVER){setRole("deliver")}else if(v===PW_OFFICE){setRole("office")}
  else{document.getElementById("loginErr").textContent="密碼不正確，請再試一次";document.getElementById("pw").value=""}}
function setRole(r){role=r;try{localStorage.setItem("pudu_role",r)}catch(e){}document.getElementById("loginErr").textContent="";document.getElementById("pw").value="";enterApp()}
function logout(){role=null;try{localStorage.removeItem("pudu_role")}catch(e){}showLogin()}
function updateRoleUI(){
  const isDlv=role==="deliver";
  document.getElementById("roleTitle").textContent=isDlv?"配送同事":"辦公室同事";
  document.getElementById("roleAct").textContent=isDlv?"打「送達」":"打「回執」";
  document.getElementById("pendLab").textContent=isDlv?"只看待送達":"只看待回執";
}

/* filters */
function pendPred(r){return role==="office"?(isD(r.seq)&&!isR(r.seq)):!isD(r.seq)}
function visible(){return RAW.filter(r=>(typeFilter==="全部"||r.type===typeFilter)&&(regionFilter==="全部"||r.loc===regionFilter)&&(!pendOnly||pendPred(r)))}
function renderChips(){const chips=document.getElementById("chips");
  const base=RAW.filter(r=>typeFilter==="全部"||r.type===typeFilter);
  const present=REGION_ORDER.filter(rg=>base.some(r=>r.loc===rg));
  chips.innerHTML=["全部",...present].map(rg=>{const n=rg==="全部"?base.length:base.filter(r=>r.loc===rg).length;
    return `<div class="chip ${rg===regionFilter?"on":""}" data-r="${rg}">${rg}<span class="c">${n}</span></div>`}).join("");
  chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{regionFilter=c.dataset.r;renderChips();render()});}

/* row */
function tickSvg(){return '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>'}
function typeTag(t){return t==="宮廟"?'<span class="tag t-temple">宮廟</span>':'<span class="tag t-comm">社區</span>'}
function ddlHtml(r){if(isD(r.seq))return"";const dl=daysLeft(r.pudu);let cls="ddl",txt;
  if(dl<0){cls+=" over";txt="已過普渡日"}else if(dl===0){cls+=" soon";txt="今天普渡"}else if(dl<=3){cls+=" soon";txt=`剩 ${dl} 天`}else{txt=`剩 ${dl} 天`}
  const d=new Date(r.pudu);return `<span class="${cls}">普渡 ${d.getMonth()+1}/${d.getDate()} · ${txt}</span>`}
function stBadge(r){if(isD(r.seq))return"";if(r.status==="已安排")return '<span class="stbadge set">已安排</span>';if(r.status==="未安排")return '<span class="stbadge">未安排</span>';return""}

function rowHtml(r,showRegion){
  const s=statusMap[r.seq]||{},dOn=!!s.delivered,rOn=!!s.receipt_received,tel=telify(r.phone);
  const phone=r.phone?`<a href="${tel?`tel:${tel}`:"#"}">${esc(r.phone)}</a>`:"";
  const contact=r.contact?" · "+esc(r.contact):"";
  const rg=showRegion?`<span class="tag t-rg">${esc(r.loc)}</span>`:"";
  const ev=r.event?`<div class="ev">${esc(r.event)}</div>`:"";
  const canD=role==="deliver",canR=role==="office";
  const dChip=`<div class="chip2 deliver ${dOn?"on":""} ${canD?"can":""}" data-act="deliver" data-seq="${r.seq}">${tickSvg()}<b>送達</b></div>`;
  const rChip=`<div class="chip2 receipt ${rOn?"on":""} ${canR?"can":""}" data-act="receipt" data-seq="${r.seq}">${tickSvg()}<b>回執</b></div>`;
  let meta="";
  if(dOn)meta+=`<span class="d">✓送達 ${esc(s.delivered_by||"")}${s.delivered_at?" · "+fmtTime(s.delivered_at):""}</span>`;
  if(dOn&&rOn)meta+="　";
  if(rOn)meta+=`<span class="r">✓回執 ${esc(s.receipt_by||"")}${s.receipt_at?" · "+fmtTime(s.receipt_at):""}</span>`;
  const cls="drow"+(dOn&&rOn?" dr":(dOn?" d":""));
  return `<div class="${cls}">
    <div class="nm">${esc(r.org)}${typeTag(r.type)}${rg}<span class="pf">5箱</span></div>${ev}
    <div class="sub2"><a href="${mapUrl(r.addr)}" target="_blank" rel="noopener">${esc(r.addr)}</a>${phone?" · "+phone:""}${contact}</div>
    ${ddlHtml(r)}${stBadge(r)}
    <div class="acts">${dChip}${rChip}</div>
    ${meta?`<div class="metaline">${meta}</div>`:""}
  </div>`;
}

function renderByDate(){const main=document.getElementById("main");const items=visible();
  if(!items.length){main.innerHTML='<div class="day"><div class="empty">目前沒有符合條件的單位。</div></div>';return}
  const byDate={};items.forEach(r=>{(byDate[r.pudu]=byDate[r.pudu]||[]).push(r)});
  const dates=Object.keys(byDate).sort();
  main.innerHTML=dates.map(iso=>{const list=byDate[iso],d=new Date(iso),md=`${d.getMonth()+1}/${d.getDate()}`,wd=WD[d.getDay()];
    const done=list.filter(r=>isD(r.seq)).length,tot=list.length,pct=Math.round(done/tot*100);
    const byReg={};list.forEach(r=>{(byReg[r.loc]=byReg[r.loc]||[]).push(r)});
    const groups=REGION_ORDER.filter(rr=>byReg[rr]).map(rr=>`<div class="rg"><div class="rg-h">${rr}（${byReg[rr].length}）</div>${byReg[rr].map(r=>rowHtml(r,false)).join("")}</div>`).join("");
    return `<div class="day"><div class="day-h">
      <div class="day-date"><div class="md">${md}</div><div class="wd">週${wd}</div></div>
      <div class="day-meta"><div class="roc">普渡 115/${d.getMonth()+1}/${d.getDate()}（${tot} 單位 · ${tot*5} 箱）</div><div class="sub">送達 ${done}/${tot}</div></div>
      <div class="ring" style="--p:${pct}"><span>${done}/${tot}</span></div></div>${groups}</div>`}).join("");
  bindRows();}

function renderByRegion(){const main=document.getElementById("main");const items=visible();
  const regs=REGION_ORDER.filter(rg=>items.some(r=>r.loc===rg));
  if(!regs.length){main.innerHTML='<div class="day"><div class="empty">目前沒有符合條件的單位。</div></div>';return}
  main.innerHTML=regs.map(rg=>{const list=items.filter(r=>r.loc===rg).sort((a,b)=>a.pudu<b.pudu?-1:1);
    const done=list.filter(r=>isD(r.seq)).length;
    return `<div class="day"><div class="day-h">
      <div class="day-date" style="background:var(--forest);min-width:52px"><div class="md" style="color:#fff;font-size:15px">${rg}</div></div>
      <div class="day-meta"><div class="roc">${rg}（${list.length} 單位 · ${list.length*5} 箱）</div><div class="sub">送達 ${done}/${list.length}</div></div>
      <div class="ring" style="--p:${Math.round(done/list.length*100)}"><span>${done}/${list.length}</span></div></div>${list.map(r=>rowHtml(r,false)).join("")}</div>`}).join("");
  bindRows();}

function render(){view==="date"?renderByDate():renderByRegion();renderStats()}
function renderStats(){const tot=RAW.length,dn=RAW.filter(r=>isD(r.seq)).length,rc=RAW.filter(r=>isR(r.seq)).length;
  document.getElementById("sTotal").textContent=tot;
  document.getElementById("sDone").textContent=dn;
  document.getElementById("sRecv").textContent=rc;
  document.getElementById("barD").style.width=(tot?dn/tot*100:0)+"%";
  document.getElementById("barR").style.width=(tot?rc/tot*100:0)+"%";
  document.getElementById("dPct").textContent=Math.round(tot?dn/tot*100:0)+"%";
  document.getElementById("rPct").textContent=Math.round(tot?rc/tot*100:0)+"%";}

function bindRows(){document.querySelectorAll(".chip2[data-act]").forEach(c=>{if(c._b)return;c._b=true;
  c.addEventListener("click",()=>act(parseInt(c.dataset.seq,10),c.dataset.act))})}

async function act(seq,kind){
  if(kind==="deliver"&&role!=="deliver"){toast("「送達」請用配送身分(8833)");return}
  if(kind==="receipt"&&role!=="office"){toast("「回執」請用辦公室身分(0726)");return}
  if(!deliverer){promptName(true);if(!deliverer)return}
  const s=Object.assign({},statusMap[seq]||{});let patch,cur;
  if(kind==="deliver"){cur=!!s.delivered;const n=!cur;patch={delivered:n,delivered_by:n?deliverer:null,delivered_at:n?new Date().toISOString():null}}
  else{cur=!!s.receipt_received;const n=!cur;patch={receipt_received:n,receipt_by:n?deliverer:null,receipt_at:n?new Date().toISOString():null}}
  statusMap[seq]=Object.assign({},s,patch);render();
  if(!sb){toast("離線：僅本機更新");return}
  const up=Object.assign({},patch,{updated_at:new Date().toISOString()});
  const {error}=await sb.from("pudu_status").update(up).eq("seq",seq);
  if(error){statusMap[seq]=s;render();toast("更新失敗，請重試");console.error(error)}
  else toast(patch.delivered===true?"已標記送達":patch.delivered===false?"已取消送達":patch.receipt_received?"已標記回執":"已取消回執");
}
function promptName(force){const v=prompt("請輸入你的名字（會記在打勾旁）：",deliverer||"");
  if(v&&v.trim()){deliverer=v.trim();saveName(deliverer);document.getElementById("meName").textContent=deliverer}
  else if(force)toast("要打勾需先設定名字")}

async function initData(){if(!sb)return;const {data,error}=await sb.from("pudu_status").select("seq,delivered,delivered_by,delivered_at,receipt_received,receipt_by,receipt_at");
  if(error){console.error(error);setSync(false);return}data.forEach(r=>statusMap[r.seq]=r);if(role)render();setSync(true)}
function setSync(live){const dot=document.getElementById("syncDot"),txt=document.getElementById("syncTxt");
  if(live){dot.classList.add("live");txt.textContent="已連線 · 即時同步"}else{dot.classList.remove("live");txt.textContent="離線（僅本機）"}}

function boot(){
  document.getElementById("meName").textContent=deliverer||"未設定";
  document.getElementById("setMe").onclick=()=>promptName(false);
  document.getElementById("logout").onclick=logout;
  document.getElementById("loginBtn").onclick=tryLogin;
  document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");view=t.dataset.view;render()});
  document.querySelectorAll("#typeSeg div").forEach(s=>s.onclick=()=>{document.querySelectorAll("#typeSeg div").forEach(x=>x.classList.remove("on"));s.classList.add("on");typeFilter=s.dataset.t;regionFilter="全部";renderChips();render()});
  const pt=document.getElementById("pendTog");pt.onclick=()=>{pendOnly=!pendOnly;pt.classList.toggle("on",pendOnly);render()};
  try{sb=supabase.createClient(SUPA_URL,SUPA_KEY,{realtime:{params:{eventsPerSecond:5}}});
    initData();
    sb.channel("pudu-rt").on("postgres_changes",{event:"*",schema:"public",table:"pudu_status"},p=>{if(p.new&&p.new.seq!=null){statusMap[p.new.seq]=p.new;if(role)render()}}).subscribe(st=>{if(st==="SUBSCRIBED")setSync(true)});
    setInterval(initData,20000);
  }catch(e){console.error(e);setSync(false)}
  if(role)enterApp();else showLogin();
}
boot();
</script>
